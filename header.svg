<svg width="900" height="310" viewBox="0 0 900 310" xmlns="http://www.w3.org/2000/svg">
  <defs>

    <!-- Deep space background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030508">
        <animate attributeName="stop-color" values="#030508;#060d1a;#030508;#08040f;#030508" dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#0a0d18">
        <animate attributeName="stop-color" values="#0a0d18;#0d1528;#0a0d18;#130a28;#0a0d18" dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#060310">
        <animate attributeName="stop-color" values="#060310;#0a0618;#060310;#04060f;#060310" dur="14s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Aurora teal (left) -->
    <radialGradient id="aurora1" cx="18%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#00b4d8" stop-opacity="0.35">
        <animate attributeName="stop-opacity" values="0.35;0.12;0.35;0.28;0.35" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="stop-color" values="#00b4d8;#0096c7;#48cae4;#00b4d8" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00b4d8" stop-opacity="0"/>
    </radialGradient>

    <!-- Aurora violet (center) -->
    <radialGradient id="aurora2" cx="52%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#7b2ff7" stop-opacity="0.3">
        <animate attributeName="stop-opacity" values="0.3;0.08;0.3;0.22;0.3" dur="11s" repeatCount="indefinite"/>
        <animate attributeName="stop-color" values="#7b2ff7;#9d4edd;#5a189a;#7b2ff7" dur="11s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#7b2ff7" stop-opacity="0"/>
    </radialGradient>

    <!-- Aurora rose (right) -->
    <radialGradient id="aurora3" cx="82%" cy="65%" r="42%">
      <stop offset="0%" stop-color="#f72585" stop-opacity="0.22">
        <animate attributeName="stop-opacity" values="0.22;0.06;0.22;0.16;0.22" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="stop-color" values="#f72585;#b5179e;#f72585" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#f72585" stop-opacity="0"/>
    </radialGradient>

    <!-- Text glow -->
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Soft glow for decorative rings -->
    <filter id="ringGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Particle glow -->
    <filter id="pGlow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Gradient for name underline -->
    <linearGradient id="uline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00b4d8" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00b4d8" stop-opacity="1"/>
      <stop offset="70%" stop-color="#7b2ff7" stop-opacity="1"/>
      <stop offset="100%" stop-color="#7b2ff7" stop-opacity="0"/>
    </linearGradient>

    <!-- Gradient for wave -->
    <linearGradient id="wave1c" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00b4d8" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#7b2ff7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f72585" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="wave2c" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7b2ff7" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#00b4d8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7b2ff7" stop-opacity="0.12"/>
    </linearGradient>

    <!-- Border gradient -->
    <linearGradient id="borderG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b4d8" stop-opacity="0.5">
        <animate attributeName="stop-opacity" values="0.5;0.15;0.5" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#7b2ff7" stop-opacity="0.5">
        <animate attributeName="stop-opacity" values="0.5;0.15;0.5" dur="6s" begin="2s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#f72585" stop-opacity="0.5">
        <animate attributeName="stop-opacity" values="0.5;0.15;0.5" dur="6s" begin="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <clipPath id="bounds"><rect width="900" height="310" rx="16"/></clipPath>
  </defs>

  <!-- ── BASE ── -->
  <rect width="900" height="310" fill="url(#bg)" rx="16"/>
  <rect width="900" height="310" fill="url(#aurora1)" rx="16"/>
  <rect width="900" height="310" fill="url(#aurora2)" rx="16"/>
  <rect width="900" height="310" fill="url(#aurora3)" rx="16"/>

  <!-- ── STARS (static tiny dots) ── -->
  <g clip-path="url(#bounds)" opacity="0.7">
    <circle cx="60"  cy="28"  r="1"   fill="white" opacity="0.6"/>
    <circle cx="130" cy="55"  r="0.7" fill="white" opacity="0.4"/>
    <circle cx="210" cy="18"  r="0.9" fill="white" opacity="0.5"/>
    <circle cx="340" cy="38"  r="0.7" fill="white" opacity="0.35"/>
    <circle cx="480" cy="22"  r="1"   fill="white" opacity="0.45"/>
    <circle cx="590" cy="44"  r="0.7" fill="white" opacity="0.4"/>
    <circle cx="700" cy="15"  r="0.9" fill="white" opacity="0.5"/>
    <circle cx="800" cy="48"  r="0.7" fill="white" opacity="0.35"/>
    <circle cx="860" cy="28"  r="1"   fill="white" opacity="0.55"/>
    <circle cx="760" cy="70"  r="0.6" fill="#00b4d8" opacity="0.7"/>
    <circle cx="140" cy="80"  r="0.6" fill="#7b2ff7" opacity="0.7"/>
    <circle cx="420" cy="58"  r="0.6" fill="#f72585" opacity="0.6"/>
    <!-- Twinkling stars -->
    <circle cx="275" cy="30" r="0.8" fill="white">
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="650" cy="20" r="0.8" fill="white">
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="4.1s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <circle cx="820" cy="60" r="0.7" fill="#00b4d8">
      <animate attributeName="opacity" values="0.7;0.1;0.7" dur="2.8s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <circle cx="80"  cy="65" r="0.7" fill="#7b2ff7">
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="3.7s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
  </g>

  <!-- ── DECORATIVE RINGS ── -->
  <g clip-path="url(#bounds)" filter="url(#ringGlow)">
    <!-- Top-left ring -->
    <circle cx="0" cy="0" r="110" fill="none" stroke="#00b4d8" stroke-width="0.6" opacity="0.2">
      <animate attributeName="opacity" values="0.2;0.06;0.2" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="155" fill="none" stroke="#00b4d8" stroke-width="0.4" opacity="0.1">
      <animate attributeName="opacity" values="0.1;0.03;0.1" dur="7s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <!-- Bottom-right ring -->
    <circle cx="900" cy="310" r="120" fill="none" stroke="#7b2ff7" stroke-width="0.6" opacity="0.2">
      <animate attributeName="opacity" values="0.2;0.05;0.2" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="310" r="170" fill="none" stroke="#f72585" stroke-width="0.4" opacity="0.1">
      <animate attributeName="opacity" values="0.1;0.03;0.1" dur="9s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <!-- Center subtle ring -->
    <circle cx="450" cy="155" r="200" fill="none" stroke="#7b2ff7" stroke-width="0.3" opacity="0.06">
      <animate attributeName="r" values="200;230;200" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.06;0.02;0.06" dur="10s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ── FLOATING PARTICLES ── -->
  <g clip-path="url(#bounds)" filter="url(#pGlow)">
    <circle cx="38"  cy="290" r="1.8" fill="#00b4d8">
      <animate attributeName="cy" values="290;20;290" dur="10s" repeatCount="indefinite" calcMode="linear"/>
      <animate attributeName="opacity" values="0.7;0;0.7" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="38;48;38" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="82"  cy="260" r="1.2" fill="#7b2ff7">
      <animate attributeName="cy" values="260;10;260" dur="8s" repeatCount="indefinite" calcMode="linear" begin="1.2s"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="8s" repeatCount="indefinite" begin="1.2s"/>
    </circle>
    <circle cx="160" cy="275" r="1.5" fill="#f72585">
      <animate attributeName="cy" values="275;30;275" dur="11s" repeatCount="indefinite" calcMode="linear" begin="2s"/>
      <animate attributeName="opacity" values="0.5;0;0.5" dur="11s" repeatCount="indefinite" begin="2s"/>
    </circle>
    <circle cx="860" cy="280" r="1.8" fill="#7b2ff7">
      <animate attributeName="cy" values="280;15;280" dur="9s" repeatCount="indefinite" calcMode="linear" begin="0.8s"/>
      <animate attributeName="opacity" values="0.7;0;0.7" dur="9s" repeatCount="indefinite" begin="0.8s"/>
      <animate attributeName="cx" values="860;850;860" dur="9s" repeatCount="indefinite" begin="0.8s"/>
    </circle>
    <circle cx="822" cy="255" r="1.2" fill="#00b4d8">
      <animate attributeName="cy" values="255;8;255" dur="7.5s" repeatCount="indefinite" calcMode="linear" begin="1.8s"/>
      <animate attributeName="opacity" values="0.5;0;0.5" dur="7.5s" repeatCount="indefinite" begin="1.8s"/>
    </circle>
    <circle cx="748" cy="285" r="1.5" fill="#f72585">
      <animate attributeName="cy" values="285;40;285" dur="12s" repeatCount="indefinite" calcMode="linear" begin="3s"/>
      <animate attributeName="opacity" values="0.4;0;0.4" dur="12s" repeatCount="indefinite" begin="3s"/>
    </circle>
    <circle cx="300" cy="295" r="1.2" fill="#00b4d8">
      <animate attributeName="cy" values="295;55;295" dur="9.5s" repeatCount="indefinite" calcMode="linear" begin="4s"/>
      <animate attributeName="opacity" values="0.35;0;0.35" dur="9.5s" repeatCount="indefinite" begin="4s"/>
    </circle>
    <circle cx="600" cy="288" r="1.5" fill="#7b2ff7">
      <animate attributeName="cy" values="288;25;288" dur="10.5s" repeatCount="indefinite" calcMode="linear" begin="5s"/>
      <animate attributeName="opacity" values="0.45;0;0.45" dur="10.5s" repeatCount="indefinite" begin="5s"/>
    </circle>
  </g>

  <!-- ── MAIN CONTENT ── -->

  <!-- Greeting (small, above name) -->
  <text x="450" y="88" font-family="'Segoe UI',system-ui,Arial,sans-serif"
        font-size="13" fill="#8892b0" text-anchor="middle" letter-spacing="4">
    WELCOME TO MY PROFILE
    <animate attributeName="opacity" values="0;0.8" dur="0.6s" fill="freeze"/>
  </text>

  <!-- Name glow layer -->
  <text x="450" y="142" font-family="'Segoe UI',system-ui,Arial,sans-serif"
        font-size="52" font-weight="800" fill="#7b2ff7" text-anchor="middle"
        opacity="0.4" filter="url(#glow)">Aditya Upadhyay</text>

  <!-- Name -->
  <text x="450" y="142" font-family="'Segoe UI',system-ui,Arial,sans-serif"
        font-size="52" font-weight="800" fill="white" text-anchor="middle">
    Aditya Upadhyay
    <animate attributeName="opacity" values="0;1" dur="0.9s" fill="freeze"/>
  </text>

  <!-- Animated underline -->
  <line x1="450" y1="152" x2="450" y2="152" stroke="url(#uline)" stroke-width="2.5" stroke-linecap="round">
    <animate attributeName="x1" values="450;200" dur="1.1s" begin="0.9s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    <animate attributeName="x2" values="450;700" dur="1.1s" begin="0.9s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </line>

  <!-- Role glow layer -->
  <text x="450" y="188" font-family="'Fira Code','Courier New',monospace"
        font-size="16.5" fill="#00b4d8" text-anchor="middle"
        opacity="0.3" filter="url(#glow)">Cloud  /  ML  /  Full-Stack Engineer</text>

  <!-- Role -->
  <text x="450" y="188" font-family="'Fira Code','Courier New',monospace"
        font-size="16.5" fill="#ccd6f6" text-anchor="middle">
    Cloud  /  ML  /  Full-Stack Engineer
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="1.5s" fill="freeze"/>
  </text>

  <!-- University -->
  <text x="450" y="218" font-family="'Segoe UI',system-ui,Arial,sans-serif"
        font-size="12" fill="#495670" text-anchor="middle" letter-spacing="2.5">
    M.S. COMPUTER SCIENCE  ·  ARIZONA STATE UNIVERSITY  ·  2027
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="1.9s" fill="freeze"/>
  </text>

  <!-- Tech pill badges -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.9s" begin="2.3s" fill="freeze"/>

    <rect x="195" y="237" width="75" height="23" rx="11.5" fill="#00b4d8" fill-opacity="0.12"
          stroke="#00b4d8" stroke-width="0.8" stroke-opacity="0.6"/>
    <text x="232" y="253" font-family="monospace" font-size="10.5" fill="#90e0ef" text-anchor="middle">AWS</text>

    <rect x="278" y="237" width="75" height="23" rx="11.5" fill="#7b2ff7" fill-opacity="0.12"
          stroke="#7b2ff7" stroke-width="0.8" stroke-opacity="0.6"/>
    <text x="315" y="253" font-family="monospace" font-size="10.5" fill="#c77dff" text-anchor="middle">Python</text>

    <rect x="361" y="237" width="75" height="23" rx="11.5" fill="#00b4d8" fill-opacity="0.10"
          stroke="#48cae4" stroke-width="0.8" stroke-opacity="0.5"/>
    <text x="398" y="253" font-family="monospace" font-size="10.5" fill="#90e0ef" text-anchor="middle">React</text>

    <rect x="444" y="237" width="75" height="23" rx="11.5" fill="#f72585" fill-opacity="0.10"
          stroke="#f72585" stroke-width="0.8" stroke-opacity="0.5"/>
    <text x="481" y="253" font-family="monospace" font-size="10.5" fill="#f9a8d4" text-anchor="middle">Java</text>

    <rect x="527" y="237" width="75" height="23" rx="11.5" fill="#7b2ff7" fill-opacity="0.10"
          stroke="#9d4edd" stroke-width="0.8" stroke-opacity="0.5"/>
    <text x="564" y="253" font-family="monospace" font-size="10.5" fill="#c77dff" text-anchor="middle">Docker</text>

    <rect x="610" y="237" width="75" height="23" rx="11.5" fill="#f72585" fill-opacity="0.10"
          stroke="#f72585" stroke-width="0.8" stroke-opacity="0.5"/>
    <text x="647" y="253" font-family="monospace" font-size="10.5" fill="#f9a8d4" text-anchor="middle">ML / AI</text>
  </g>

  <!-- ── BOTTOM WAVES ── -->
  <path d="M0,276 Q150,264 300,276 Q450,288 600,276 Q750,264 900,276 L900,310 L0,310 Z"
        fill="url(#wave1c)">
    <animate attributeName="d"
      values="M0,276 Q150,264 300,276 Q450,288 600,276 Q750,264 900,276 L900,310 L0,310 Z;
              M0,282 Q150,270 300,282 Q450,294 600,282 Q750,270 900,282 L900,310 L0,310 Z;
              M0,276 Q150,264 300,276 Q450,288 600,276 Q750,264 900,276 L900,310 L0,310 Z"
      dur="5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
  </path>
  <path d="M0,287 Q150,279 300,287 Q450,295 600,287 Q750,279 900,287 L900,310 L0,310 Z"
        fill="url(#wave2c)">
    <animate attributeName="d"
      values="M0,287 Q150,279 300,287 Q450,295 600,287 Q750,279 900,287 L900,310 L0,310 Z;
              M0,292 Q150,284 300,292 Q450,300 600,292 Q750,284 900,292 L900,310 L0,310 Z;
              M0,287 Q150,279 300,287 Q450,295 600,287 Q750,279 900,287 L900,310 L0,310 Z"
      dur="7s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
  </path>

  <!-- ── BORDER ── -->
  <rect width="900" height="310" rx="16" fill="none" stroke="url(#borderG)" stroke-width="1" opacity="0.6"/>
</svg>
