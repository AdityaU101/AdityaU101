<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17">
        <animate attributeName="stop-color" values="#0a0e17;#0d1a35;#0a0e17;#15082a;#0a0e17" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#161b22">
        <animate attributeName="stop-color" values="#161b22;#1a2744;#161b22;#261a44;#161b22" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0d1117">
        <animate attributeName="stop-color" values="#0d1117;#0f2030;#0d1117;#1a0f30;#0d1117" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="orb1" cx="25%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.5">
        <animate attributeName="stop-opacity" values="0.5;0.15;0.5" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="stop-color" values="#1f6feb;#58a6ff;#1f6feb" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="76%" cy="50%" r="42%">
      <stop offset="0%" stop-color="#a371f7" stop-opacity="0.4">
        <animate attributeName="stop-opacity" values="0.4;0.12;0.4" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="76%;80%;76%;72%;76%" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#a371f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb3" cx="85%" cy="18%" r="25%">
      <stop offset="0%" stop-color="#56d364" stop-opacity="0.22">
        <animate attributeName="stop-opacity" values="0.22;0.05;0.22" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#56d364" stop-opacity="0"/>
    </radialGradient>
    <filter id="textGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dotGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a371f7" stop-opacity="1"/>
      <stop offset="100%" stop-color="#56d364" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#58a6ff" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#a371f7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a371f7" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="bounds"><rect width="900" height="300" rx="14"/></clipPath>
  </defs>

  <!-- Background layers -->
  <rect width="900" height="300" fill="url(#bg)" rx="14"/>
  <rect width="900" height="300" fill="url(#orb1)" rx="14"/>
  <rect width="900" height="300" fill="url(#orb2)" rx="14"/>
  <rect width="900" height="300" fill="url(#orb3)" rx="14"/>

  <!-- Grid -->
  <g clip-path="url(#bounds)" opacity="0.055" stroke="#58a6ff" stroke-width="0.6">
    <line x1="0" y1="75" x2="900" y2="75"/><line x1="0" y1="150" x2="900" y2="150"/>
    <line x1="0" y1="225" x2="900" y2="225"/>
    <line x1="100" y1="0" x2="100" y2="300"/><line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="300"/><line x1="400" y1="0" x2="400" y2="300"/>
    <line x1="500" y1="0" x2="500" y2="300"/><line x1="600" y1="0" x2="600" y2="300"/>
    <line x1="700" y1="0" x2="700" y2="300"/><line x1="800" y1="0" x2="800" y2="300"/>
  </g>

  <!-- Scanning line -->
  <g clip-path="url(#bounds)">
    <rect x="0" y="-3" width="900" height="3" fill="url(#scanGrad)" opacity="0.9">
      <animate attributeName="y" values="-3;303;-3" dur="6s" repeatCount="indefinite" calcMode="linear"/>
      <animate attributeName="opacity" values="0;0.9;0.9;0.9;0" keyTimes="0;0.04;0.5;0.96;1" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Particles -->
  <g clip-path="url(#bounds)" filter="url(#dotGlow)">
    <circle cx="42" cy="285" r="2.5" fill="#58a6ff">
      <animate attributeName="cy" values="285;15;285" dur="9s" repeatCount="indefinite" calcMode="linear"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="42;52;42" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="88" cy="240" r="1.5" fill="#a371f7">
      <animate attributeName="cy" values="240;8;240" dur="7s" repeatCount="indefinite" calcMode="linear" begin="1s"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="7s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <circle cx="28" cy="175" r="2" fill="#56d364">
      <animate attributeName="cy" values="175;5;175" dur="11s" repeatCount="indefinite" calcMode="linear" begin="2s"/>
      <animate attributeName="opacity" values="0.7;0;0.7" dur="11s" repeatCount="indefinite" begin="2s"/>
      <animate attributeName="cx" values="28;38;28" dur="11s" repeatCount="indefinite" begin="2s"/>
    </circle>
    <circle cx="148" cy="290" r="1.8" fill="#58a6ff">
      <animate attributeName="cy" values="290;30;290" dur="8s" repeatCount="indefinite" calcMode="linear" begin="0.5s"/>
      <animate attributeName="opacity" values="0.5;0;0.5" dur="8s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <circle cx="198" cy="260" r="2" fill="#ffa657">
      <animate attributeName="cy" values="260;12;260" dur="10s" repeatCount="indefinite" calcMode="linear" begin="3s"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="10s" repeatCount="indefinite" begin="3s"/>
    </circle>
    <circle cx="858" cy="270" r="2.5" fill="#a371f7">
      <animate attributeName="cy" values="270;18;270" dur="8.5s" repeatCount="indefinite" calcMode="linear" begin="0.5s"/>
      <animate attributeName="opacity" values="0.7;0;0.7" dur="8.5s" repeatCount="indefinite" begin="0.5s"/>
      <animate attributeName="cx" values="858;848;858" dur="8.5s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <circle cx="820" cy="248" r="1.5" fill="#58a6ff">
      <animate attributeName="cy" values="248;8;248" dur="7.5s" repeatCount="indefinite" calcMode="linear" begin="1.5s"/>
      <animate attributeName="opacity" values="0.5;0;0.5" dur="7.5s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
    <circle cx="878" cy="195" r="2" fill="#56d364">
      <animate attributeName="cy" values="195;5;195" dur="9.5s" repeatCount="indefinite" calcMode="linear" begin="2.5s"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="9.5s" repeatCount="indefinite" begin="2.5s"/>
    </circle>
    <circle cx="748" cy="280" r="1.5" fill="#ffa657">
      <animate attributeName="cy" values="280;42;280" dur="6.5s" repeatCount="indefinite" calcMode="linear" begin="1s"/>
      <animate attributeName="opacity" values="0.4;0;0.4" dur="6.5s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <circle cx="398" cy="292" r="1.5" fill="#58a6ff">
      <animate attributeName="cy" values="292;52;292" dur="12s" repeatCount="indefinite" calcMode="linear" begin="4s"/>
      <animate attributeName="opacity" values="0.35;0;0.35" dur="12s" repeatCount="indefinite" begin="4s"/>
    </circle>
    <circle cx="498" cy="278" r="1" fill="#a371f7">
      <animate attributeName="cy" values="278;38;278" dur="10s" repeatCount="indefinite" calcMode="linear" begin="2s"/>
      <animate attributeName="opacity" values="0.4;0;0.4" dur="10s" repeatCount="indefinite" begin="2s"/>
    </circle>
    <circle cx="598" cy="288" r="2" fill="#56d364">
      <animate attributeName="cy" values="288;22;288" dur="11s" repeatCount="indefinite" calcMode="linear" begin="5s"/>
      <animate attributeName="opacity" values="0.5;0;0.5" dur="11s" repeatCount="indefinite" begin="5s"/>
    </circle>
    <circle cx="318" cy="295" r="1.5" fill="#58a6ff">
      <animate attributeName="cy" values="295;62;295" dur="9s" repeatCount="indefinite" calcMode="linear" begin="3.5s"/>
      <animate attributeName="opacity" values="0.4;0;0.4" dur="9s" repeatCount="indefinite" begin="3.5s"/>
    </circle>
    <circle cx="678" cy="268" r="1" fill="#ffa657">
      <animate attributeName="cy" values="268;48;268" dur="8s" repeatCount="indefinite" calcMode="linear" begin="1.5s"/>
      <animate attributeName="opacity" values="0.3;0;0.3" dur="8s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
  </g>

  <!-- Corner decorations -->
  <text x="18" y="34" font-family="monospace" font-size="16" fill="#58a6ff" opacity="0.55">&lt;dev&gt;</text>
  <text x="808" y="288" font-family="monospace" font-size="16" fill="#a371f7" opacity="0.55">&lt;/dev&gt;</text>

  <!-- Traffic light dots -->
  <circle cx="848" cy="22" r="5" fill="#f85149">
    <animate attributeName="opacity" values="1;0.4;1" dur="2.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="864" cy="22" r="5" fill="#ffa657">
    <animate attributeName="opacity" values="1;0.4;1" dur="2.1s" begin="0.35s" repeatCount="indefinite"/>
  </circle>
  <circle cx="880" cy="22" r="5" fill="#56d364">
    <animate attributeName="opacity" values="1;0.4;1" dur="2.1s" begin="0.7s" repeatCount="indefinite"/>
  </circle>

  <!-- Main heading glow layer -->
  <text x="450" y="124" font-family="'Segoe UI',system-ui,Arial,sans-serif"
        font-size="46" font-weight="800" fill="#1f6feb" text-anchor="middle"
        opacity="0.45" filter="url(#textGlow)">Hey, I'm Aditya!</text>

  <!-- Main heading -->
  <text x="450" y="124" font-family="'Segoe UI',system-ui,Arial,sans-serif"
        font-size="46" font-weight="800" fill="white" text-anchor="middle">
    Hey, I'm Aditya! &#x1F44B;
    <animate attributeName="opacity" values="0;1" dur="0.9s" fill="freeze"/>
  </text>

  <!-- Expanding underline -->
  <line x1="450" y1="135" x2="450" y2="135" stroke="url(#lineGrad)" stroke-width="2.5" stroke-linecap="round">
    <animate attributeName="x1" values="450;160" dur="1.2s" begin="0.9s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    <animate attributeName="x2" values="450;740" dur="1.2s" begin="0.9s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </line>

  <!-- Subtitle -->
  <text x="450" y="173" font-family="'Fira Code','Courier New',monospace"
        font-size="16" fill="#58a6ff" text-anchor="middle" filter="url(#textGlow)">
    &#x2601;&#xFE0F; Cloud &#xB7; &#x1F916; ML &#xB7; &#x26A1; Full-Stack Engineer
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="1.5s" fill="freeze"/>
  </text>

  <!-- University tag -->
  <text x="450" y="207" font-family="'Segoe UI',system-ui,Arial,sans-serif"
        font-size="12.5" fill="#8b949e" text-anchor="middle" letter-spacing="2.5">
    M.S. COMPUTER SCIENCE &#xB7; ARIZONA STATE UNIVERSITY &#xB7; 2027
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="2s" fill="freeze"/>
  </text>

  <!-- Tech badges -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="2.4s" fill="freeze"/>
    <rect x="213" y="226" width="72" height="22" rx="11" fill="#1f6feb" fill-opacity="0.18" stroke="#58a6ff" stroke-width="0.8" stroke-opacity="0.7"/>
    <text x="249" y="241" font-family="monospace" font-size="10.5" fill="#79c0ff" text-anchor="middle">AWS</text>
    <rect x="293" y="226" width="72" height="22" rx="11" fill="#a371f7" fill-opacity="0.18" stroke="#a371f7" stroke-width="0.8" stroke-opacity="0.7"/>
    <text x="329" y="241" font-family="monospace" font-size="10.5" fill="#c9a7f7" text-anchor="middle">Python</text>
    <rect x="373" y="226" width="72" height="22" rx="11" fill="#56d364" fill-opacity="0.14" stroke="#56d364" stroke-width="0.8" stroke-opacity="0.6"/>
    <text x="409" y="241" font-family="monospace" font-size="10.5" fill="#56d364" text-anchor="middle">React</text>
    <rect x="453" y="226" width="72" height="22" rx="11" fill="#ffa657" fill-opacity="0.14" stroke="#ffa657" stroke-width="0.8" stroke-opacity="0.6"/>
    <text x="489" y="241" font-family="monospace" font-size="10.5" fill="#ffa657" text-anchor="middle">Java</text>
    <rect x="533" y="226" width="72" height="22" rx="11" fill="#58a6ff" fill-opacity="0.14" stroke="#58a6ff" stroke-width="0.8" stroke-opacity="0.6"/>
    <text x="569" y="241" font-family="monospace" font-size="10.5" fill="#79c0ff" text-anchor="middle">Docker</text>
    <rect x="613" y="226" width="72" height="22" rx="11" fill="#f85149" fill-opacity="0.14" stroke="#f85149" stroke-width="0.8" stroke-opacity="0.6"/>
    <text x="649" y="241" font-family="monospace" font-size="10.5" fill="#f85149" text-anchor="middle">ML / AI</text>
  </g>

  <!-- Wave 1 -->
  <path d="M0,268 Q150,257 300,268 Q450,279 600,268 Q750,257 900,268 L900,300 L0,300 Z"
        fill="#58a6ff" fill-opacity="0.07">
    <animate attributeName="d"
      values="M0,268 Q150,257 300,268 Q450,279 600,268 Q750,257 900,268 L900,300 L0,300 Z;
              M0,274 Q150,263 300,274 Q450,285 600,274 Q750,263 900,274 L900,300 L0,300 Z;
              M0,268 Q150,257 300,268 Q450,279 600,268 Q750,257 900,268 L900,300 L0,300 Z"
      dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
  </path>

  <!-- Wave 2 -->
  <path d="M0,279 Q150,271 300,279 Q450,287 600,279 Q750,271 900,279 L900,300 L0,300 Z"
        fill="#a371f7" fill-opacity="0.07">
    <animate attributeName="d"
      values="M0,279 Q150,271 300,279 Q450,287 600,279 Q750,271 900,279 L900,300 L0,300 Z;
              M0,284 Q150,276 300,284 Q450,292 600,284 Q750,276 900,284 L900,300 L0,300 Z;
              M0,279 Q150,271 300,279 Q450,287 600,279 Q750,271 900,279 L900,300 L0,300 Z"
      dur="5.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
  </path>

  <!-- Wave 3 -->
  <path d="M0,289 Q150,283 300,289 Q450,295 600,289 Q750,283 900,289 L900,300 L0,300 Z"
        fill="#56d364" fill-opacity="0.05">
    <animate attributeName="d"
      values="M0,289 Q150,283 300,289 Q450,295 600,289 Q750,283 900,289 L900,300 L0,300 Z;
              M0,293 Q150,287 300,293 Q450,299 600,293 Q750,287 900,293 L900,300 L0,300 Z;
              M0,289 Q150,283 300,289 Q450,295 600,289 Q750,283 900,289 L900,300 L0,300 Z"
      dur="7s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
  </path>

  <!-- Border glow -->
  <rect width="900" height="300" rx="14" fill="none" stroke="url(#lineGrad)" stroke-width="1" stroke-opacity="0.35"/>
</svg>
