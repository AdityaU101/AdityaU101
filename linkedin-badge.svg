<svg width="220" height="60" viewBox="0 0 220 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Clip to badge shape — keeps everything inside rounded corners -->
    <clipPath id="c"><rect width="220" height="60" rx="14"/></clipPath>

    <!-- Soft icon glow (contained) -->
    <filter id="ig" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Shimmer beam -->
    <linearGradient id="sh" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="white" stop-opacity="0"/>
      <stop offset="44%"  stop-color="white" stop-opacity="0"/>
      <stop offset="50%"  stop-color="white" stop-opacity="0.42"/>
      <stop offset="56%"  stop-color="white" stop-opacity="0"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>

    <!-- Border gradient -->
    <linearGradient id="brd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0A66C2"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Left panel gradient (top-to-bottom) -->
    <linearGradient id="lp" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#1d86e0"/>
      <stop offset="100%" stop-color="#084fa8"/>
    </linearGradient>

    <!-- Badge background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <!-- ── Badge base ── -->
  <rect width="220" height="60" rx="14" fill="url(#bg)"/>

  <!-- ── Left colour panel (clipped to badge shape) ── -->
  <rect x="0" y="0" width="66" height="60" fill="url(#lp)" clip-path="url(#c)">
    <animate attributeName="opacity" values="1;0.76;1" dur="2.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Subtle top highlight on panel -->
  <rect x="0" y="0" width="66" height="30" fill="white" fill-opacity="0.06" clip-path="url(#c)"/>

  <!-- ── LinkedIn "in" icon ── -->
  <rect x="18" y="14" width="30" height="30" rx="6" fill="white" filter="url(#ig)">
    <animate attributeName="opacity" values="1;0.88;1" dur="2.2s" repeatCount="indefinite"/>
  </rect>
  <text x="33" y="35" font-family="Arial Black, Arial, sans-serif"
        font-size="16" font-weight="900" fill="#0A66C2" text-anchor="middle">in</text>

  <!-- ── Separator line ── -->
  <line x1="66" y1="13" x2="66" y2="47"
        stroke="white" stroke-width="0.5" stroke-opacity="0.12"/>

  <!-- ── Right text area ── -->
  <text x="143" y="25" font-family="'Segoe UI', Arial, sans-serif"
        font-size="9.5" fill="#7d8590" text-anchor="middle" letter-spacing="2.8">LINKEDIN</text>
  <text x="143" y="44" font-family="'Segoe UI', Arial, sans-serif"
        font-size="16.5" font-weight="700" fill="white" text-anchor="middle">
    Connect →
    <animate attributeName="fill" values="white;#93c5fd;white" dur="2.2s" repeatCount="indefinite"/>
  </text>

  <!-- ── Shimmer sweep ── -->
  <rect x="-220" y="0" width="220" height="60" fill="url(#sh)" clip-path="url(#c)">
    <animate attributeName="x" values="-220;440" dur="3.2s" repeatCount="indefinite" begin="0s"/>
  </rect>

  <!-- ── Breathing border ── -->
  <rect width="220" height="60" rx="14" fill="none" stroke="url(#brd)" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values="0.9;0.28;0.9" dur="2.2s" repeatCount="indefinite"/>
  </rect>
</svg>
