<svg width="210" height="58" viewBox="0 0 210 58" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="c"><rect width="210" height="58" rx="12"/></clipPath>

    <!-- Soft icon / outer glow -->
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="outerGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Shimmer stripe (narrow white beam) -->
    <linearGradient id="sh" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="white" stop-opacity="0"/>
      <stop offset="40%"  stop-color="white" stop-opacity="0"/>
      <stop offset="50%"  stop-color="white" stop-opacity="0.45"/>
      <stop offset="60%"  stop-color="white" stop-opacity="0"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>

    <!-- Border gradient -->
    <linearGradient id="bord" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0A66C2"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>

    <!-- Left panel vertical sheen -->
    <linearGradient id="panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#1a7fd4"/>
      <stop offset="50%"  stop-color="#0A66C2"/>
      <stop offset="100%" stop-color="#084a96"/>
    </linearGradient>
  </defs>

  <!-- ── Background ── -->
  <rect width="210" height="58" rx="12" fill="#0d1117"/>

  <!-- ── Left panel ── -->
  <rect x="0" y="0" width="62" height="58" fill="url(#panel)" clip-path="url(#c)">
    <animate attributeName="opacity" values="1;0.75;1" dur="2.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Panel inner edge highlight -->
  <rect x="0" y="0" width="62" height="58" fill="url(#panel)" clip-path="url(#c)" opacity="0">
    <animate attributeName="opacity" values="0;0.4;0" dur="2.2s" repeatCount="indefinite"/>
  </rect>

  <!-- ── LinkedIn "in" icon (white rounded square + dark text) ── -->
  <rect x="16" y="13" width="30" height="30" rx="6" fill="white" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.85;1" dur="2.2s" repeatCount="indefinite"/>
  </rect>
  <text x="31" y="34" font-family="Arial Black, Arial, sans-serif"
        font-size="16" font-weight="900" fill="#0A66C2" text-anchor="middle">in</text>

  <!-- ── Separator ── -->
  <line x1="62" y1="11" x2="62" y2="47" stroke="#1a7fd4" stroke-width="1" stroke-opacity="0.4"/>

  <!-- ── Platform label + action ── -->
  <text x="136" y="23" font-family="'Segoe UI', Arial, sans-serif"
        font-size="9.5" fill="#6e7f9b" text-anchor="middle" letter-spacing="3">LINKEDIN</text>
  <text x="136" y="42" font-family="'Segoe UI', Arial, sans-serif"
        font-size="17" font-weight="700" fill="white" text-anchor="middle">
    Connect →
    <animate attributeName="fill" values="white;#90cdf4;white" dur="2.2s" repeatCount="indefinite"/>
  </text>

  <!-- ── Shimmer sweep (staggered: begins immediately) ── -->
  <rect x="-210" y="0" width="210" height="58" fill="url(#sh)" clip-path="url(#c)">
    <animate attributeName="x" values="-210;420" dur="2.8s" repeatCount="indefinite" begin="0.2s"/>
  </rect>

  <!-- ── Outer glow pulse ── -->
  <rect x="-3" y="-3" width="216" height="64" rx="14"
        fill="none" stroke="#0A66C2" stroke-width="5" filter="url(#outerGlow)">
    <animate attributeName="stroke-opacity" values="0.55;0.08;0.55" dur="2.2s" repeatCount="indefinite"/>
  </rect>

  <!-- ── Animated border ── -->
  <rect width="210" height="58" rx="12" fill="none" stroke="url(#bord)" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite"/>
  </rect>
</svg>
