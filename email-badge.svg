<svg width="210" height="58" viewBox="0 0 210 58" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="c"><rect width="210" height="58" rx="12"/></clipPath>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="outerGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <linearGradient id="sh" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="white" stop-opacity="0"/>
      <stop offset="40%"  stop-color="white" stop-opacity="0"/>
      <stop offset="50%"  stop-color="white" stop-opacity="0.45"/>
      <stop offset="60%"  stop-color="white" stop-opacity="0"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>

    <!-- Border: red → orange -->
    <linearGradient id="bord" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#EA4335"/>
      <stop offset="100%" stop-color="#ff9500"/>
    </linearGradient>

    <!-- Left panel: deep red sheen -->
    <linearGradient id="panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#f05545"/>
      <stop offset="50%"  stop-color="#EA4335"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </linearGradient>
  </defs>

  <!-- ── Background ── -->
  <rect width="210" height="58" rx="12" fill="#0d1117"/>

  <!-- ── Left panel ── -->
  <rect x="0" y="0" width="62" height="58" fill="url(#panel)" clip-path="url(#c)">
    <animate attributeName="opacity" values="1;0.72;1" dur="2.6s" repeatCount="indefinite"/>
  </rect>

  <!-- Orange highlight pulse on panel -->
  <rect x="0" y="0" width="62" height="58" fill="#ff9500" fill-opacity="0" clip-path="url(#c)">
    <animate attributeName="fill-opacity" values="0;0.15;0" dur="2.6s" repeatCount="indefinite"/>
  </rect>

  <!-- ── Gmail envelope icon (official path, 24×24 viewBox → scaled ~28×28) ── -->
  <g transform="translate(9, 15) scale(1.83)" filter="url(#glow)">
    <!--
      Gmail "M" envelope — SimpleIcons path (viewBox 0 0 24 24).
      Scaled 1.83× → ~44×44 but clipped into left panel.
      Envelope body (outer rect with rounded bottom):
    -->
    <path fill="white"
      d="M24 5.457v13.909c0 .904-.732 1.636-1.636 1.636h-3.819V11.73L12 16.64l-6.545-4.91
         v9.273H1.636A1.636 1.636 0 0 1 0 19.366V5.457c0-2.023 2.309-3.178 3.927-1.964
         L5.455 4.64 12 9.548l6.545-4.907 1.528-1.148C21.69 2.28 24 3.434 24 5.457z"/>
    <animate attributeName="opacity" values="1;0.8;1" dur="2.6s" repeatCount="indefinite"/>
  </g>

  <!-- ── Separator ── -->
  <line x1="62" y1="11" x2="62" y2="47" stroke="#EA4335" stroke-width="1" stroke-opacity="0.4"/>

  <!-- ── Labels ── -->
  <text x="136" y="23" font-family="'Segoe UI', Arial, sans-serif"
        font-size="9.5" fill="#6e7f9b" text-anchor="middle" letter-spacing="3">GMAIL</text>
  <text x="136" y="42" font-family="'Segoe UI', Arial, sans-serif"
        font-size="17" font-weight="700" fill="white" text-anchor="middle">
    Email Me →
    <animate attributeName="fill" values="white;#fca5a5;white" dur="2.6s" repeatCount="indefinite"/>
  </text>

  <!-- ── Shimmer sweep (staggered: begins at 2s) ── -->
  <rect x="-210" y="0" width="210" height="58" fill="url(#sh)" clip-path="url(#c)">
    <animate attributeName="x" values="-210;420" dur="2.8s" repeatCount="indefinite" begin="2s"/>
  </rect>

  <!-- ── Outer glow pulse ── -->
  <rect x="-3" y="-3" width="216" height="64" rx="14"
        fill="none" stroke="#EA4335" stroke-width="5" filter="url(#outerGlow)">
    <animate attributeName="stroke-opacity" values="0.55;0.08;0.55" dur="2.6s" repeatCount="indefinite"/>
  </rect>

  <!-- ── Animated border ── -->
  <rect width="210" height="58" rx="12" fill="none" stroke="url(#bord)" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values="1;0.35;1" dur="2.6s" repeatCount="indefinite"/>
  </rect>
</svg>
