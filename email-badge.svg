<svg width="220" height="60" viewBox="0 0 220 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="c"><rect width="220" height="60" rx="14"/></clipPath>

    <filter id="ig" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <linearGradient id="sh" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="white" stop-opacity="0"/>
      <stop offset="44%"  stop-color="white" stop-opacity="0"/>
      <stop offset="50%"  stop-color="white" stop-opacity="0.42"/>
      <stop offset="56%"  stop-color="white" stop-opacity="0"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>

    <!-- Border gradient: red → amber -->
    <linearGradient id="brd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#EA4335"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Left panel: deep red -->
    <linearGradient id="lp" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#f05545"/>
      <stop offset="100%" stop-color="#a91c10"/>
    </linearGradient>

    <!-- Badge background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <!-- ── Badge base ── -->
  <rect width="220" height="60" rx="14" fill="url(#bg)"/>

  <!-- ── Left colour panel ── -->
  <rect x="0" y="0" width="66" height="60" fill="url(#lp)" clip-path="url(#c)">
    <animate attributeName="opacity" values="1;0.74;1" dur="2.6s" repeatCount="indefinite"/>
  </rect>

  <!-- Amber highlight pulse on panel -->
  <rect x="0" y="0" width="66" height="60" fill="#f59e0b" fill-opacity="0" clip-path="url(#c)">
    <animate attributeName="fill-opacity" values="0;0.16;0" dur="2.6s" repeatCount="indefinite"/>
  </rect>

  <!-- Subtle top highlight -->
  <rect x="0" y="0" width="66" height="30" fill="white" fill-opacity="0.05" clip-path="url(#c)"/>

  <!-- ── Gmail envelope icon (simple clean shape) ── -->
  <!-- Envelope body -->
  <rect x="11" y="17" width="36" height="25" rx="4" fill="white" filter="url(#ig)">
    <animate attributeName="opacity" values="1;0.86;1" dur="2.6s" repeatCount="indefinite"/>
  </rect>
  <!-- Envelope flap "M" fold -->
  <polyline points="11,17 29,31 47,17"
            fill="none" stroke="#EA4335" stroke-width="2.2"
            stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Bottom fold lines (subtle) -->
  <line x1="11" y1="42" x2="22" y2="32" stroke="#EA4335" stroke-width="1.2" stroke-opacity="0.5"/>
  <line x1="47" y1="42" x2="36" y2="32" stroke="#EA4335" stroke-width="1.2" stroke-opacity="0.5"/>

  <!-- ── Separator ── -->
  <line x1="66" y1="13" x2="66" y2="47"
        stroke="white" stroke-width="0.5" stroke-opacity="0.12"/>

  <!-- ── Right text area ── -->
  <text x="143" y="25" font-family="'Segoe UI', Arial, sans-serif"
        font-size="9.5" fill="#7d8590" text-anchor="middle" letter-spacing="2.8">GMAIL</text>
  <text x="143" y="44" font-family="'Segoe UI', Arial, sans-serif"
        font-size="16.5" font-weight="700" fill="white" text-anchor="middle">
    Email Me →
    <animate attributeName="fill" values="white;#fca5a5;white" dur="2.6s" repeatCount="indefinite"/>
  </text>

  <!-- ── Shimmer sweep (staggered +2 s) ── -->
  <rect x="-220" y="0" width="220" height="60" fill="url(#sh)" clip-path="url(#c)">
    <animate attributeName="x" values="-220;440" dur="3.2s" repeatCount="indefinite" begin="2s"/>
  </rect>

  <!-- ── Breathing border ── -->
  <rect width="220" height="60" rx="14" fill="none" stroke="url(#brd)" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values="0.9;0.28;0.9" dur="2.6s" repeatCount="indefinite"/>
  </rect>
</svg>
