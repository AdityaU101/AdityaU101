<svg width="210" height="58" viewBox="0 0 210 58" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="c"><rect width="210" height="58" rx="12"/></clipPath>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="outerGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <linearGradient id="sh" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="white" stop-opacity="0"/>
      <stop offset="40%"  stop-color="white" stop-opacity="0"/>
      <stop offset="50%"  stop-color="white" stop-opacity="0.45"/>
      <stop offset="60%"  stop-color="white" stop-opacity="0"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>

    <!-- Border: purple → cyan -->
    <linearGradient id="bord" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#7b2ff7"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>

    <!-- Left panel: dark with subtle purple sheen -->
    <linearGradient id="panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#2d333b"/>
      <stop offset="50%"  stop-color="#21262d"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <!-- ── Background ── -->
  <rect width="210" height="58" rx="12" fill="#0d1117"/>

  <!-- ── Left panel ── -->
  <rect x="0" y="0" width="62" height="58" fill="url(#panel)" clip-path="url(#c)">
    <animate attributeName="opacity" values="1;0.7;1" dur="2.4s" repeatCount="indefinite"/>
  </rect>

  <!-- Purple tint pulse on panel -->
  <rect x="0" y="0" width="62" height="58" fill="#7b2ff7" fill-opacity="0" clip-path="url(#c)">
    <animate attributeName="fill-opacity" values="0;0.18;0" dur="2.4s" repeatCount="indefinite"/>
  </rect>

  <!-- ── GitHub Octocat icon (official path, 24×24 viewBox → scaled 28×28, centred at 31,29) ── -->
  <g transform="translate(14.5, 14) scale(1.375)" filter="url(#glow)">
    <path fill="white"
      d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577
         0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7
         3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236
         1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332
         -5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0
         1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405
         2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91
         1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22
         0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592
         24 12.297c0-6.627-5.373-12-12-12"/>
    <animate attributeName="opacity" values="1;0.8;1" dur="2.4s" repeatCount="indefinite"/>
  </g>

  <!-- ── Separator ── -->
  <line x1="62" y1="11" x2="62" y2="47" stroke="#7b2ff7" stroke-width="1" stroke-opacity="0.4"/>

  <!-- ── Labels ── -->
  <text x="136" y="23" font-family="'Segoe UI', Arial, sans-serif"
        font-size="9.5" fill="#6e7f9b" text-anchor="middle" letter-spacing="3">GITHUB</text>
  <text x="136" y="42" font-family="'Segoe UI', Arial, sans-serif"
        font-size="17" font-weight="700" fill="white" text-anchor="middle">
    Follow →
    <animate attributeName="fill" values="white;#c77dff;white" dur="2.4s" repeatCount="indefinite"/>
  </text>

  <!-- ── Shimmer sweep (staggered: begins at 1s) ── -->
  <rect x="-210" y="0" width="210" height="58" fill="url(#sh)" clip-path="url(#c)">
    <animate attributeName="x" values="-210;420" dur="2.8s" repeatCount="indefinite" begin="1s"/>
  </rect>

  <!-- ── Outer glow pulse ── -->
  <rect x="-3" y="-3" width="216" height="64" rx="14"
        fill="none" stroke="#7b2ff7" stroke-width="5" filter="url(#outerGlow)">
    <animate attributeName="stroke-opacity" values="0.55;0.08;0.55" dur="2.4s" repeatCount="indefinite"/>
  </rect>

  <!-- ── Animated border ── -->
  <rect width="210" height="58" rx="12" fill="none" stroke="url(#bord)" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
  </rect>
</svg>
