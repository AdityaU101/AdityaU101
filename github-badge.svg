<svg width="220" height="60" viewBox="0 0 220 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="c"><rect width="220" height="60" rx="14"/></clipPath>

    <filter id="ig" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <linearGradient id="sh" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="white" stop-opacity="0"/>
      <stop offset="44%"  stop-color="white" stop-opacity="0"/>
      <stop offset="50%"  stop-color="white" stop-opacity="0.42"/>
      <stop offset="56%"  stop-color="white" stop-opacity="0"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>

    <!-- Border gradient: purple → cyan -->
    <linearGradient id="brd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#7b2ff7"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>

    <!-- Left panel: dark charcoal with purple undertone -->
    <linearGradient id="lp" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#2d2640"/>
      <stop offset="100%" stop-color="#161222"/>
    </linearGradient>

    <!-- Badge background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <!-- ── Badge base ── -->
  <rect width="220" height="60" rx="14" fill="url(#bg)"/>

  <!-- ── Left colour panel ── -->
  <rect x="0" y="0" width="66" height="60" fill="url(#lp)" clip-path="url(#c)">
    <animate attributeName="opacity" values="1;0.72;1" dur="2.4s" repeatCount="indefinite"/>
  </rect>

  <!-- Purple shimmer pulse on panel -->
  <rect x="0" y="0" width="66" height="60" fill="#7b2ff7" fill-opacity="0" clip-path="url(#c)">
    <animate attributeName="fill-opacity" values="0;0.2;0" dur="2.4s" repeatCount="indefinite"/>
  </rect>

  <!-- Subtle top highlight -->
  <rect x="0" y="0" width="66" height="30" fill="white" fill-opacity="0.04" clip-path="url(#c)"/>

  <!-- ── GitHub Octocat icon (official 24×24 path, scaled 1.17× → 28×28, centred at 33,30) ── -->
  <g transform="translate(19, 16) scale(1.167)" filter="url(#ig)">
    <path fill="white"
      d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385
         .6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04
         -3.338.724-4.042-1.61-4.042-1.61
         C4.422 18.07 3.633 17.7 3.633 17.7
         c-1.087-.744.084-.729.084-.729
         1.205.084 1.838 1.236 1.838 1.236
         1.07 1.835 2.809 1.305 3.495.998
         .108-.776.417-1.305.76-1.605
         -2.665-.3-5.466-1.332-5.466-5.93
         0-1.31.465-2.38 1.235-3.22
         -.135-.303-.54-1.523.105-3.176
         0 0 1.005-.322 3.3 1.23
         .96-.267 1.98-.399 3-.405
         1.02.006 2.04.138 3 .405
         2.28-1.552 3.285-1.23 3.285-1.23
         .645 1.653.24 2.873.12 3.176
         .765.84 1.23 1.91 1.23 3.22
         0 4.61-2.805 5.625-5.475 5.92
         .42.36.81 1.096.81 2.22
         0 1.606-.015 2.896-.015 3.286
         0 .315.21.69.825.57
         C20.565 22.092 24 17.592 24 12.297
         c0-6.627-5.373-12-12-12">
      <animate attributeName="opacity" values="1;0.82;1" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- ── Separator ── -->
  <line x1="66" y1="13" x2="66" y2="47"
        stroke="white" stroke-width="0.5" stroke-opacity="0.12"/>

  <!-- ── Right text area ── -->
  <text x="143" y="25" font-family="'Segoe UI', Arial, sans-serif"
        font-size="9.5" fill="#7d8590" text-anchor="middle" letter-spacing="2.8">GITHUB</text>
  <text x="143" y="44" font-family="'Segoe UI', Arial, sans-serif"
        font-size="16.5" font-weight="700" fill="white" text-anchor="middle">
    Follow →
    <animate attributeName="fill" values="white;#c77dff;white" dur="2.4s" repeatCount="indefinite"/>
  </text>

  <!-- ── Shimmer sweep (staggered +1 s) ── -->
  <rect x="-220" y="0" width="220" height="60" fill="url(#sh)" clip-path="url(#c)">
    <animate attributeName="x" values="-220;440" dur="3.2s" repeatCount="indefinite" begin="1s"/>
  </rect>

  <!-- ── Breathing border ── -->
  <rect width="220" height="60" rx="14" fill="none" stroke="url(#brd)" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values="0.9;0.28;0.9" dur="2.4s" repeatCount="indefinite"/>
  </rect>
</svg>
